<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon / Rounded Rect -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0e1424" stroke="url(#logoGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Stylized 'RO' / Tech Symbol -->
  <!-- Left Pillar / R loop -->
  <path d="M30 72 V 28 H 48 C 58 28 62 34 62 42 C 62 50 56 54 48 54 H 30" fill="none" stroke="url(#logoGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 54 L 62 72" fill="none" stroke="url(#logoGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code Bracket Accent -->
  <path d="M68 32 L 76 40 L 68 48" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="72" cy="62" r="3" fill="#10b981"/>
</svg>
